<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>1-6 - Task Management Application</title>
  <link rel="stylesheet" href="style.css?v=2">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <header>
    <h1>Task Management Application</h1>
    <input type="search" placeholder="Search tasks...">
  </header>

  <div class="layout">

    <aside>  
      <select class="user-select">
        <option>Guest</option>  
        <option>Standard user</option>  
        <option>Admin</option>    
      </select>

      <section class="admin-area panel">
        <h2>Administration area</h2>
        
        <h3>Task summary</h3>
        <ul>
          <li>To do: 1</li>
          <li>In progress: 1</li>
          <li>Done: 1</li>
        </ul>

        <h3>Users</h3>
        <button type="button">Manage users</button>

        <h3>Tasks</h3>
        <button type="button">Manage tasks</button>

        <h3>Audit log</h3>
        <button type="button">View audit log</button>

      </section>

      <form class="taskentry panel">
        <label>Title:
          <input type="text">
        </label>

        <label>Description:
          <textarea> 

          </textarea>
        </label>

      <label>Priority:
        <select>
          <option>Low</option>
          <option>Medium</option>
          <option>High</option>
        </select>
      </label>  

      <label>Status:
        <select>
          <option>To do</option>
          <option>In progress</option>
          <option>Done</option>
        </select>
      </label>  

      <label>Due date:
        <input type="date">
      </label>

      <label>Assign to:
        <select>
          <option>Guest</option>
          <option>Standard user</option>
          <option>Admin</option>
        </select>
      </label>  

        <button type="submit">Submit</button>  

      </form>
    </aside>

    <main>
      <section class="column">
        <h2>To do</h2>
        <article class="card">make backend skeleton</article>
      </section>
    
      <section class="column">
        <h2>In Progress</h2>
        <article class="card">make frontend skeleton</article>
      </section>

      <section class="column">
        <h2>Done</h2>
      <article class="card">setup docker</article>
      </section>
    </main>

  </div>
</body>
</html>
