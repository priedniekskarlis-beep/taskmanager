<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>1-6 - Task Management Application</title>
  <link rel="stylesheet" href="style.css?v=6">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <header>
    <h1>Task Management Application</h1>
    <label for="search">Search tasks</label>
    <input type="search" placeholder="Search tasks..." id="search">
  </header>

  <div class="layout">

    <aside>  
      <label for="role-select">View as</label>
      <select id="role-select" class="user-select">
        <option>Guest</option>  
        <option>Standard user</option>  
        <option>Admin</option>    
      </select>

      <section class="admin-area panel">
        <h2>Administration area</h2>
        
        <h3>Task summary</h3>
        <ul>
          <li id="count-todo">To do: 1</li>
          <li id="count-inprogress">In progress: 1</li>
          <li id="count-done">Done: 1</li>
        </ul>

        <h3>Users</h3>
        <button type="button">Manage users</button>

        <h3>Tasks</h3>
        <button type="button">Manage tasks</button>

        <h3>Audit log</h3>
        <button type="button">View audit log</button>

      </section>

      <form class="taskentry panel">
        <label>Title:
          <input type="text" id="task-title" maxlength="140">
        </label>

        <label>Description:
          <textarea id="task-description" maxlength="5000"></textarea>
        </label>

      <label>Priority:
        <select id="task-priority">
          <option>Low</option>
          <option>Medium</option>
          <option>High</option>
        </select>
      </label>  

      <label>Status:
        <select id="task-status">
          <option>To do</option>
          <option>In progress</option>
          <option>Done</option>
        </select>
      </label>  

      <label>Due date:
        <input type="date" id="task-due-date">
      </label>

      <label>Assign to:
        <select>
          <option>Guest</option>
          <option>Standard user</option>
          <option>Admin</option>
        </select>
      </label>  

        <button type="submit">Submit</button>  
        <p id="form-error"></p>
    </form>
  </aside>

    <main>
      <section class="column" data-status="To do">
        <h2>To do</h2>
        <p id="empty-todo">No tasks yet</p>
      </section>
    
      <section class="column" data-status="In progress">
        <h2>In progress</h2>
        <p id="empty-inprogress">No tasks yet</p>
      </section>
      <section class="column" data-status="Done">
        <h2>Done</h2>
        <p id="empty-done">No tasks yet</p>
      </section>
    </main>
  </div>
  <div id="modal-overlay" style="display: none">
  <div class="modal">
    <button id="modal-close">✕</button>
    <label>Title:
      <input type="text" id="modal-title" maxlength="140">
    </label>
    <label>Status:
      <select id="modal-status">
        <option>To do</option>
        <option>In progress</option>
        <option>Done</option>
      </select>
    </label>
    <label>Priority:
      <select id="modal-priority">
        <option>Low</option><option>Medium</option><option>High</option>
      </select>
    </label>
    <label>Due date:
      <input type="date" id="modal-due-date">
    </label>
    <label>Description:
      <textarea id="modal-description" maxlength="5000"></textarea>
    </label>
    <button id="modal-save">Save</button>
    <p id="modal-error"></p>
  </div>
</div>
  <script defer src="script.js"></script> 
</body>
</html>
