<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>1-6 - Task Management Application</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <header>
    <h1>Task Management Application</h1>
    <input type="search" placeholder="Search tasks...">
  </header>

  <div class="layout">

    <aside>  
      <select> 
        <option>Guest</option>  
        <option>Standard User</option>  
        <option>Admin</option>    
      </select> 

      <form class="taskentry">
        <label>Title:
          <input type="text">
        </label>

        <label>Description:
          <textarea> 

          </textarea>
        </label>

      <label>Priority:
        <select>
          <option>Low</option>
          <option>Medium</option>
          <option>High</option>
        </select>
      </label>  

      <label>Status:
        <select>
          <option>To do</option>
          <option>In Progress</option>
          <option>Done</option>
        </select>
      </label>  

      <label>Assign to:
        <select>
          <option>Guest</option>
          <option>Standard User</option>
          <option>Admin</option>
        </select>
      </label>  

      <label>Due date:
        <input type="date">
      </label>

        <button type="submit">Submit</button>  

      </form>
    </aside>

    <main>
      <section class="column">
        <h2>To do</h2>
        <article class="card">make backend skeleton</article>
      </section>
    
      <section class="column">
        <h2>In Progress</h2>
        <article class="card">make frontend skeleton</article>
      </section>

      <section class="column">
        <h2>Done</h2>
      <article class="card">setup docker</article>
      </section>
    </main>

  </div>
</body>
</html>
